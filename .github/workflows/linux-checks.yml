name: Linux checks

on:
  push:
    branches:
      - main
      - linux-phase1-wayland
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python sources
        run: python -m compileall -q great_sage
      - name: Validate JavaScript
        run: python check_js.py
      - name: Validate shaders
        run: python check_shaders.py
      - name: Validate routing
        run: python check_routing.py
      - name: Validate NVIDIA model routing
        run: python check_nvidia_routing.py
      - name: Validate ChatEngine tool-call shape
        run: python check_chat_engine.py
      - name: Validate provider privacy and routing policy
        run: python check_provider_policy.py
      - name: Validate Linux platform bridge
        run: python check_platform.py
